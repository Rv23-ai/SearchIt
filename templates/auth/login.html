{% extends 'base.html' %}

{% block title %}Login - SearchIt{% endblock %}

{% block content %}
<div class="max-w-md mx-auto my-12">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 mb-4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Sign in to SearchIt</h1>
            <p class="text-xs text-slate-500 mt-1">Access campus lost & found reporting with your institutional account</p>
        </div>

        <!-- Form -->
        <form action="{{ url_for('auth.login') }}{% if request.args.get('next') %}?next={{ request.args.get('next') }}{% endif %}" method="POST" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <!-- College Email -->
            <div>
                <label for="college_email" class="block text-sm font-semibold text-slate-700 mb-1.5">College Email Address</label>
                <div class="relative">
                    <input type="email" id="college_email" name="college_email" value="{{ college_email or '' }}" required placeholder="student@college.edu"
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                </div>
                <p class="text-xs text-slate-500 mt-1">Must end with @college.edu</p>
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-xl shadow-sm hover:shadow transition duration-150">
                Sign In
            </button>
        </form>

        <!-- Footer link -->
        <div class="mt-6 text-center text-xs text-slate-600 border-t border-slate-100 pt-5">
            Don't have an institutional account yet?
            <a href="{{ url_for('auth.register') }}" class="font-semibold text-indigo-600 hover:text-indigo-500 transition ml-1">Register here</a>
        </div>
    </div>
</div>
{% endblock %}
