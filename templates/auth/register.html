{% extends 'base.html' %}

{% block title %}Register - SearchIt{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto my-8 sm:my-14 relative">
    <!-- Floating Aurora ambient glow orbs behind card -->
    <div class="absolute -top-12 -right-12 w-64 h-64 bg-emerald-500/15 rounded-full blur-3xl pointer-events-none animate-pulse-subtle"></div>
    <div class="absolute -bottom-12 -left-12 w-64 h-64 bg-indigo-500/15 rounded-full blur-3xl pointer-events-none animate-pulse-subtle" style="animation-delay: 1.5s;"></div>

    <div class="relative z-10 glass-panel-glow rounded-3xl p-8 sm:p-10 border border-white/10 shadow-2xl space-y-8">
        
        <!-- Header -->
        <div class="text-center space-y-3">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-emerald-500/20 to-cyan-500/20 border border-emerald-500/30 text-emerald-400 shadow-glow-emerald">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                </svg>
            </div>
            <div class="space-y-1">
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">Create Account</h1>
                <p class="text-xs sm:text-sm text-slate-400">Join SearchIt with your verified institutional credentials</p>
            </div>
        </div>

        <!-- Form -->
        <form action="{{ url_for('auth.register') }}" method="POST" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <!-- College Email -->
            <div class="space-y-1.5">
                <label for="college_email" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Campus Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
                        </svg>
                    </div>
                    <input type="email" id="college_email" name="college_email" value="{{ college_email or '' }}" required placeholder="your.name@college.edu"
                        class="w-full pl-10 pr-4 py-3 rounded-xl bg-black/40 border border-white/10 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 transition">
                </div>
                <div class="flex items-center space-x-1.5 pt-0.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                    <p class="text-[11px] text-emerald-300/90 font-medium">Domain restriction enforced (@college.edu)</p>
                </div>
            </div>

            <!-- Grid for Student ID & Department -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Student ID -->
                <div class="space-y-1.5">
                    <label for="student_id" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Student / Roll ID</label>
                    <div class="relative">
                        <input type="text" id="student_id" name="student_id" value="{{ student_id or '' }}" required placeholder="CS2026-042"
                            class="w-full px-4 py-3 rounded-xl bg-black/40 border border-white/10 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-cyan-400 transition">
                    </div>
                </div>

                <!-- Department -->
                <div class="space-y-1.5">
                    <label for="department" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Department</label>
                    <div class="relative">
                        <input type="text" id="department" name="department" value="{{ department or '' }}" required placeholder="Computer Science"
                            class="w-full px-4 py-3 rounded-xl bg-black/40 border border-white/10 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-cyan-400 transition">
                    </div>
                </div>
            </div>

            <!-- Password -->
            <div class="space-y-1.5">
                <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                    </div>
                    <input type="password" id="password" name="password" required placeholder="Minimum 8 characters"
                        class="w-full pl-10 pr-4 py-3 rounded-xl bg-black/40 border border-white/10 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 transition">
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="space-y-1.5">
                <label for="confirm_password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider">Confirm Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                        </svg>
                    </div>
                    <input type="password" id="confirm_password" name="confirm_password" required placeholder="Re-enter password"
                        class="w-full pl-10 pr-4 py-3 rounded-xl bg-black/40 border border-white/10 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:border-emerald-400 transition">
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full py-3.5 px-4 bg-gradient-to-r from-emerald-400 via-teal-400 to-cyan-400 hover:from-emerald-300 hover:to-cyan-300 text-slate-950 font-bold text-sm rounded-xl transition duration-150 shadow-glow-emerald hover:scale-[1.02] active:scale-[0.98] mt-2">
                Complete Registration
            </button>
        </form>

        <!-- Footer link -->
        <div class="relative text-center border-t border-white/10 pt-6">
            <p class="text-xs text-slate-400">
                Already have an institutional account?
                <a href="{{ url_for('auth.login') }}" class="font-bold text-emerald-400 hover:text-cyan-300 transition ml-1">Sign in instead</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
