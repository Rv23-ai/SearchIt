{% extends 'base.html' %}

{% block title %}Register - SearchIt{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto my-10">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-50 text-indigo-600 mb-4">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-900">Create Institutional Account</h1>
            <p class="text-xs text-slate-500 mt-1">Join SearchIt with your verified campus credentials</p>
        </div>

        <!-- Form -->
        <form action="{{ url_for('auth.register') }}" method="POST" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <!-- College Email -->
            <div>
                <label for="college_email" class="block text-sm font-semibold text-slate-700 mb-1.5">Campus Email Address</label>
                <input type="email" id="college_email" name="college_email" value="{{ college_email or '' }}" required placeholder="your.name@college.edu"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                <div class="mt-1 flex items-center space-x-1.5">
                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
                    <p class="text-xs text-slate-500">Domain restriction enforced (@college.edu)</p>
                </div>
            </div>

            <!-- Grid for Student ID & Department -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <!-- Student ID -->
                <div>
                    <label for="student_id" class="block text-sm font-semibold text-slate-700 mb-1.5">Student / Roll ID</label>
                    <input type="text" id="student_id" name="student_id" value="{{ student_id or '' }}" required placeholder="CS2026-042"
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                </div>

                <!-- Department -->
                <div>
                    <label for="department" class="block text-sm font-semibold text-slate-700 mb-1.5">Department</label>
                    <input type="text" id="department" name="department" value="{{ department or '' }}" required placeholder="Computer Science"
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
                </div>
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">Password</label>
                <input type="password" id="password" name="password" required placeholder="Min. 6 characters"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
            </div>

            <!-- Confirm Password -->
            <div>
                <label for="confirm_password" class="block text-sm font-semibold text-slate-700 mb-1.5">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="Re-enter password"
                    class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-xl shadow-sm hover:shadow transition duration-150">
                Complete Registration
            </button>
        </form>

        <!-- Footer link -->
        <div class="mt-6 text-center text-xs text-slate-600 border-t border-slate-100 pt-5">
            Already have an account?
            <a href="{{ url_for('auth.login') }}" class="font-semibold text-indigo-600 hover:text-indigo-500 transition ml-1">Sign in instead</a>
        </div>
    </div>
</div>
{% endblock %}
